<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento UC Retail &amp; Wholesale (local)</title>
<style>
:root {
  --bmw: #0066B1;
  --bmw-light: #E8F1F8;
  --mini: #F5811F;
  --mini-light: #FDEEE1;
  --bg: #F7F8FA;
  --panel: #FFFFFF;
  --border: #E2E5EA;
  --text: #1A1D21;
  --text-muted: #6B7280;
  --ok: #2E7D32;
  --bad: #C62828;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}
#boot-screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); gap: 14px; z-index: 999; text-align: center; padding: 20px;
}
#boot-screen .spinner {
  width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--bmw);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#boot-log { font-size: 12px; color: var(--text-muted); max-width: 480px; white-space: pre-wrap; }
#boot-error { color: var(--bad); font-weight: 600; max-width: 560px; white-space: pre-wrap; }

#app { display: none; min-height: 100vh; }
#app.ready { display: flex; }

#sidebar {
  width: 230px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
  padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
#sidebar h1 { font-size: 16px; margin: 4px 8px 16px; }
#sidebar .navbtn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 10px;
  border: none; background: none; border-radius: var(--radius); cursor: pointer; font-size: 13.5px;
  color: var(--text); margin-bottom: 2px;
}
#sidebar .navbtn:hover { background: var(--bg); }
#sidebar .navbtn.active { background: var(--bmw-light); color: var(--bmw); font-weight: 600; }
#sidebar .navbtn:disabled { opacity: 0.4; cursor: not-allowed; }
#sidebar .filename { font-size: 11px; color: var(--text-muted); padding: 0 10px; margin-top: 8px; word-break: break-all; }

#content { flex: 1; padding: 22px 28px 60px; max-width: 1400px; }
h2.pagetitle { margin: 0 0 4px; font-size: 22px; }
p.subtitle { color: var(--text-muted); margin: 0 0 18px; max-width: 900px; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 180px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }

label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
select, input[type=text], input[type=number], input[type=file] {
  width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13.5px;
  background: var(--panel); color: var(--text);
}
input[type=number] { width: 90px; }
button.btn {
  padding: 8px 14px; border-radius: 6px; border: 1px solid var(--bmw); background: var(--bmw); color: white;
  font-size: 13.5px; cursor: pointer; font-weight: 600;
}
button.btn:hover { opacity: 0.9; }
button.btn.secondary { background: var(--panel); color: var(--bmw); }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button.linklike { background: none; border: none; color: var(--bmw); cursor: pointer; font-size: 12.5px; padding: 2px 0; text-decoration: underline; }

.brandbar { color: white; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 1.1rem; margin-bottom: 10px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.78rem; font-weight: 600; color: white; }

.metricgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 8px 0; }
.metric { background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.metric .label { font-size: 11.5px; color: var(--text-muted); }
.metric .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
.metric .help { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

.sectiontitle { font-size: 13.5px; font-weight: 700; margin: 18px 0 6px; text-transform: none; }
.caption { font-size: 12px; color: var(--text-muted); }
.semaforo-ok { color: var(--ok); font-weight: 600; }
.semaforo-bad { color: var(--bad); font-weight: 600; }
.semaforo-none { color: var(--text-muted); }
.alert { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin: 8px 0; }
.alert-info { background: #E8F1F8; color: #0D4C7A; }
.alert-warn { background: #FFF4E5; color: #7A4B00; }
.alert-error { background: #FDEAEA; color: #7A1313; }
.alert-ok { background: #E8F5E9; color: #1B5E20; }

table.datatable { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.datatable th, table.datatable td { border: 1px solid var(--border); padding: 5px 8px; text-align: center; white-space: nowrap; }
table.datatable th { background: var(--bg); position: sticky; top: 0; }
table.datatable td:nth-child(1), table.datatable td:nth-child(2),
table.datatable th:nth-child(1), table.datatable th:nth-child(2) { text-align: left; }
table.datatable tbody tr:nth-child(even) { background: #FAFBFC; }
.tablewrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 6px; }
tr.row-directo td { background: #FFF3CD !important; font-weight: 600; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; flex-wrap: nowrap; }
.tabs button { padding: 8px 12px; border: none; background: none; cursor: pointer; font-size: 12.5px; white-space: nowrap; border-bottom: 2px solid transparent; color: var(--text-muted); }
.tabs button.active { color: var(--bmw); border-bottom-color: var(--bmw); font-weight: 600; }

details.guide { margin-top: 10px; }
details.guide summary { cursor: pointer; font-size: 12.5px; color: var(--bmw); }

dialog.detail-modal { border: none; border-radius: var(--radius); padding: 0; width: min(900px, 92vw); max-height: 82vh; }
dialog.detail-modal::backdrop { background: rgba(0,0,0,0.4); }
dialog.detail-modal .dm-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
dialog.detail-modal .dm-body { padding: 12px 16px; overflow: auto; max-height: 64vh; }

.evo-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 8px 0; }
.evo-chart .bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 2px; }
.evo-chart .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
.evo-chart .bar { width: 10px; border-radius: 2px 2px 0 0; }
.evo-chart .xlabel { font-size: 9.5px; color: var(--text-muted); }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

.editable-table input[type=number] { width: 70px; padding: 4px 6px; font-size: 12px; }
footer.note { color: var(--text-muted); font-size: 11.5px; margin-top: 30px; border-top: 1px solid var(--border); padding-top: 10px; }
</style>
</head>
<body>

<div id="boot-screen">
  <div class="spinner"></div>
  <div><strong>Cargando Python en el navegador…</strong></div>
  <div id="boot-log">Preparando Pyodide (la primera vez puede tardar 15-30s; luego el navegador lo recuerda).</div>
  <div id="boot-error"></div>
</div>

<div id="app">
  <nav id="sidebar">
    <h1>📊 Seguimiento UC</h1>
    <button class="navbtn" data-page="home">🏠 Home</button>
    <button class="navbtn" data-page="dashboard" disabled>📈 Dashboard</button>
    <button class="navbtn" data-page="objetivos" disabled>🎯 Objetivos y datos manuales</button>
    <button class="navbtn" data-page="ranking" disabled>🏆 Ranking</button>
    <button class="navbtn" data-page="exportar" disabled>⬇️ Exportar</button>
    <button class="navbtn" data-page="detalle" disabled>🚗 Detalle de vehículos</button>
    <button class="navbtn" data-page="seguimiento" disabled>🗂️ Seguimiento UC Retail &amp; Wholesale</button>
    <div class="filename" id="sidebar-filename"></div>
  </nav>
  <main id="content"></main>
</div>

</body>
</html>
